    // ==========================================

    const hospitalsList = [

    const testCases = [
      {

        label: 'Sprawa #1: Umowa o pracę (firma >20 os.)',

    // ==========================================
    // 2. SIMPLE STORK SVG ILLUSTRATION
    // ==========================================
    function getSimpleStorkIllustration() {
      return `
        <svg class="w-44 h-44 mx-auto stork-float" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">

          <circle cx="105" cy="68" r="21" fill="#FFFFFF"/>
          <path d="M122 63L174 71L121 77Z" fill="#E8533F"/>

          <circle cx="111" cy="64" r="1" fill="#FFFFFF"/>
        </svg>
      `;
    }

    // ==========================================
    // 3. BENEFITS & EDGE CASES ENGINE
    // ==========================================
    function calculateBenefitsModel() {
      const netFactor = 0.785;
      const baseGross = appState.momGross;
      const rate = appState.rateOption === '81_5'
        ? (appState.params.rateCombined / 100)
        : (appState.params.rateMaternity / 100);

      const requiredWaitingDays = appState.employmentType === 'uop' ? 30 : 90;
      const hasSickRight = appState.employmentType !== 'ustanie_upadlosc' && appState.insuranceDays >= requiredWaitingDays;
      const isBankruptcyProtection = appState.employmentType === 'ustanie_upadlosc';

      let monthlyMatNet = isBankruptcyProtection && appState.phase === 'postpartum'
        ? 1000
        : Math.round(baseGross * netFactor * rate);

      if (appState.partTimeFraction > 0 && appState.scenarioType !== 'loss') {
        monthlyMatNet = Math.round(monthlyMatNet * (1 - appState.partTimeFraction));
      }

      const sickMonthlyNet = hasSickRight
        ? Math.round(baseGross * netFactor * (appState.params.rateSickPregnancy / 100))
        : (isBankruptcyProtection ? Math.round(baseGross * netFactor) : 0);

      let baseWeeks = appState.childrenCount === 1 ? 20 : (appState.childrenCount === 2 ? 31 : 33);
      let parentalWeeks = appState.childrenCount === 1 ? 41 : 43;
      let supplementaryWeeks = 0;
      let ageBlocked = false;

      if (appState.scenarioType === 'premature') {
        supplementaryWeeks = appState.prematureWeeks || 8;
      }
      if (appState.zaZyciem && appState.scenarioType !== 'loss') {
        parentalWeeks += 24;
      }
      if (appState.partTimeFraction > 0 && appState.scenarioType !== 'loss') {
        parentalWeeks = Math.round(parentalWeeks / (1 - appState.partTimeFraction));
      }
      if (appState.scenarioType === 'adoption' && appState.childAgeYears > 14) {
        ageBlocked = true;
      }
      if (appState.scenarioType === 'foster' && appState.childAgeYears > 7) {
        ageBlocked = true;
      }

      let totalWeeks = baseWeeks + supplementaryWeeks + parentalWeeks;
      if (appState.scenarioType === 'loss') {
        baseWeeks = 8;
        parentalWeeks = 0;
        supplementaryWeeks = 0;
        totalWeeks = 8;
      }
      if (ageBlocked) totalWeeks = 0;

      let payerLabel = appState.employerSizeOver20
        ? 'Pracodawca (płatnik >20 ubezp.)'
        : 'ZUS (pracodawca ≤20 ubezp. składa Z-3)';
      let requiredForm = appState.employerSizeOver20 ? 'Wniosek ZAM do pracodawcy' : 'ZAM + druk Z-3 do ZUS';

      if (appState.employmentType === 'jdg') {
        payerLabel = 'ZUS (bezpośrednio na konto)';
        requiredForm = appState.phase === 'pregnancy' ? 'Wniosek ZAS-53 do ZUS' : 'Wniosek ZAM bezpośrednio do ZUS';
      } else if (appState.employmentType === 'zlecenie') {
        payerLabel = appState.employerSizeOver20 ? 'Zleceniodawca (>20 ubezp.)' : 'ZUS (zleceniodawca składa Z-3a)';
        requiredForm = appState.employerSizeOver20 ? 'Wniosek ZAM do zleceniodawcy' : 'ZAM + Z-3a do ZUS';
      } else if (isBankruptcyProtection) {
        payerLabel = 'ZUS (ochrona po likwidacji/upadłości)';
        requiredForm = 'ZAM + świadectwo pracy / wyrok sądu';
      }

      const edgeAlerts = [];
      if (!hasSickRight && appState.phase === 'pregnancy') {
        edgeAlerts.push({
          type: 'danger',
          title: `Okres wyczekiwania (${appState.insuranceDays}/${requiredWaitingDays} dni)`,
          text: `Brakuje jeszcze ${requiredWaitingDays - appState.insuranceDays} dni ubezpieczenia chorobowego do prawa do płatnego L4 w ciąży (100%).`
        });
      }
      if (appState.employmentType === 'jdg' && appState.hasDebtJdg) {
        edgeAlerts.push({
          type: 'warning',
          title: `Zaległość na koncie ZUS (${appState.debtAmount} zł)`,
          text: 'Sprawdź stan zadłużenia na dzień powstania prawa do świadczenia — ureguluj składki lub złóż wniosek o układ ratalny.'
        });
      }
      if (isBankruptcyProtection && appState.phase === 'pregnancy') {
        edgeAlerts.push({
          type: 'info',
          title: 'Zasiłek w wysokości zasiłku macierzyńskiego (100%)',
          text: 'Gdy firma upadła lub została zlikwidowana w ciąży, ZUS wypłaca 100% podstawy aż do dnia porodu.'
        });
      }
      if (appState.scenarioType === 'loss') {
        edgeAlerts.push({
          type: 'calm',
          title: 'Wsparcie i 8 tygodni urlopu macierzyńskiego',
          text: 'W przypadku urodzenia martwego dziecka lub zgonu przed 8. tygodniem życia przysługuje 8 tygodni zasiłku macierzyńskiego (nie krócej niż 7 dni od zgonu). Podstawą jest karta martwego urodzenia lub akt urodzenia z adnotacją.'
        });
      }
      if (ageBlocked) {
        edgeAlerts.push({
          type: 'danger',
          title: 'Przekroczony limit wieku dziecka',
          text: appState.scenarioType === 'foster'
            ? 'Dla rodziny zastępczej niezawodowej urlop na warunkach macierzyńskiego przysługuje do ukończenia przez dziecko 7 lat (10 lat przy odroczeniu obowiązku szkolnego).'
            : 'W przypadku przysposobienia (adopcji) urlop przysługuje do ukończenia przez dziecko 14 lat.'
        });
      }

      return {
        monthlyMatNet,
        sickMonthlyNet,
        hasSickRight,
        baseWeeks,
        supplementaryWeeks,
        parentalWeeks,
        totalWeeks,
        payerLabel,
        requiredForm,
        edgeAlerts
      };
    }

    // ==========================================
    // 4. NAVIGATION & STATE HELPERS
    // ==========================================
    function navigateTo(tabName) {
      appState.currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        btn.classList.toggle('text-zus-primary', isActive);
        btn.classList.toggle('font-bold', isActive);
        btn.classList.toggle('text-slate-400', !isActive);
      });
      renderScreen();
    }

    function setStagePhase(phase) {
      appState.phase = phase;
      renderScreen();
    }

    function toggleStep(phase, key) {
      appState.tasks[phase][key] = !appState.tasks[phase][key];
      renderScreen();
    }

    function startGuidedFlow(phase) {
      appState.phase = phase;
      appState.wizardStep = 1;
      appState.showMoreOptions = false;
      navigateTo('benefits');
    }

    // ==========================================
    // 5. TAB 1: START (Minimalist Onboarding)
    // ==========================================

      return `

            </div>

            <button onclick="appState.wizardStep=2; renderScreen();" class="w-full mt-5 py-4 rounded-2xl bg-[#007A3D] hover:bg-[#005C2E] text-white font-bold text-sm shadow-sm cursor-pointer transition">
              Dalej →
            </button>
          </div>
        `;
      }

      // STEP 2: Wynagrodzenie, wariant wypłaty oraz sytuacje szczególne (rozwijane)
      if (step === 2) {
        return `

                      <button onclick="appState.scenarioType='adoption'; renderScreen();" class="py-2 px-2 rounded-xl font-bold border cursor-pointer ${appState.scenarioType === 'adoption' ? 'bg-zus-light border-zus-primary text-zus-dark' : 'bg-slate-50 border-slate-200 text-slate-600'}">🏡 Adopcja (do 14 l.)</button>

                    ${appState.scenarioType !== 'loss' ? `
                      <div class="flex items-center justify-between pt-1">
                        <div class="flex gap-1">
                          ${[1, 2, 3].map(n => `
                            <button onclick="appState.childrenCount=${n}; renderScreen();" class="px-2 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${appState.childrenCount === n ? 'bg-zus-primary text-white' : 'bg-slate-100 text-slate-600'}">${n === 1 ? '1 dziecko' : (n === 2 ? 'Bliźniaki' : 'Trojaczki+')}</button>
                          `).join('')}
                        </div>
                        <label class="flex items-center gap-1.5 text-[11px] font-bold text-slate-700 cursor-pointer">
                          <input type="checkbox" ${appState.zaZyciem ? 'checked' : ''} onchange="appState.zaZyciem=this.checked; renderScreen();" class="accent-[#007A3D]">

                      <div class="flex items-center justify-between pt-1 border-t border-slate-100 text-[11px]">
                        <span class="font-bold text-slate-700">Praca na rodzicielskim:</span>
                        <div class="flex gap-1">
                          ${[
                            { v: 0, label: 'Brak' },
                            { v: 0.25, label: '1/4 etatu' },
                            { v: 0.5, label: '1/2 etatu' }
                          ].map(pt => `
                            <button onclick="appState.partTimeFraction=${pt.v}; renderScreen();" class="px-2 py-1 rounded-lg font-bold cursor-pointer ${appState.partTimeFraction === pt.v ? 'bg-zus-primary text-white' : 'bg-slate-100 text-slate-600'}">${pt.label}</button>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>
                ` : ''}
              </div>
            </div>

            <button onclick="appState.wizardStep=3; renderScreen();" class="w-full mt-6 py-4 rounded-2xl bg-[#007A3D] hover:bg-[#005C2E] text-white font-bold text-sm shadow-sm cursor-pointer transition">
              Pokaż moje świadczenia →
            </button>
          </div>
        `;
      }

      // STEP 3: Klarowne podsumowanie + alerty edge case'ów + 1 konkretny krok do działania
      const totalMonthly = calc.totalWeeks > 0
        ? calc.monthlyMatNet + (appState.scenarioType === 'loss' ? 0 : 800)
        : 0;

      return `
        <div class="px-5 pt-2 pb-8 space-y-3.5 screen-enter">
          ${progressHeader}

          <!-- Result Card -->
          <div class="bg-gradient-to-br from-[#007A3D] to-[#005C2E] rounded-[26px] p-5 text-white shadow-md">
            <div class="text-xs font-semibold text-emerald-100">Twoje miesięczne wsparcie (na rękę)</div>
            <div class="text-3xl font-extrabold tracking-tight mt-1">${totalMonthly.toLocaleString('pl-PL')} zł <span class="text-xs font-normal text-emerald-100">/ mies.</span></div>

            <div class="mt-4 pt-3.5 border-t border-white/15 space-y-1.5 text-xs">
              <div class="flex justify-between">
                <span class="text-emerald-100">Zasiłek macierzyński (${calc.totalWeeks} tyg.):</span>
                <span class="font-extrabold">${calc.totalWeeks > 0 ? calc.monthlyMatNet.toLocaleString('pl-PL') + ' zł' : '0 zł'}</span>
              </div>
              ${calc.supplementaryWeeks > 0 ? `
                <div class="flex justify-between text-emerald-200">
                  <span>• w tym uzupełniający (wcześniak):</span>
                  <span class="font-bold">+${calc.supplementaryWeeks} tyg. (100%)</span>
                </div>
              ` : ''}
              ${appState.partTimeFraction > 0 && appState.scenarioType !== 'loss' ? `
                <div class="flex justify-between text-emerald-200">
                  <span>• wydłużenie za pracę (${appState.partTimeFraction === 0.5 ? '1/2' : '1/4'} etatu):</span>
                  <span class="font-bold">proporcjonalne</span>
                </div>
              ` : ''}
              ${appState.scenarioType !== 'loss' && calc.totalWeeks > 0 ? `
                <div class="flex justify-between">
                  <span class="text-emerald-100">Świadczenie 800+:</span>
                  <span class="font-extrabold">800 zł</span>
                </div>
              ` : ''}
              ${appState.phase === 'pregnancy' ? `
                <div class="flex justify-between">
                  <span class="text-emerald-100">L4 w ciąży (kod B • 100%):</span>
                  <span class="font-extrabold">${calc.hasSickRight ? calc.sickMonthlyNet.toLocaleString('pl-PL') + ' zł' : 'Brak prawa (wyczekiwanie)'}</span>

            </div>
          </div>

          <!-- Dynamic Edge Case Alerts -->
          ${calc.edgeAlerts.map(al => `
            <div class="p-3.5 rounded-2xl border text-xs leading-relaxed ${

        { key: 'step2', title: 'Wniosek ZAM (do 21 dni po porodzie)', sub: 'Zastąpił ZUR i ZAO od 24.10.2026 r. — wybór 81,5%' },

        { key: 'step2', title: 'Wniosek ZAM + 800+ w PUE/eZUS', sub: 'Wypłata zasiłku przez pracodawcę (Z-3) lub ZUS' },

            <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Urlopy i wnioski</h1>
            <div class="bg-slate-200/70 p-0.5 rounded-full flex text-[11px] font-bold">
              <button onclick="setStagePhase('pregnancy')" class="px-3 py-1 rounded-full cursor-pointer transition ${isPreg ? 'bg-[#007A3D] text-white' : 'text-slate-600'}">Ciąża</button>

          <!-- Leave Split Simulator (Mama vs Tata) -->

            <div class="grid grid-cols-2 gap-2.5">
              <div class="bg-zus-light/70 rounded-2xl p-3 text-center">
                <div class="text-[11px] font-bold text-slate-600">👩 Mama</div>
                <div class="text-xl font-extrabold text-[#006B38] mt-0.5">${appState.momWeeks} tyg.</div>
                <div class="text-[10px] text-slate-500">min. 14 tyg. obowiązkowe</div>
              </div>
              <div class="bg-sky-50 rounded-2xl p-3 text-center">
                <div class="text-[11px] font-bold text-slate-600">👨 Tata</div>
                <div class="text-xl font-extrabold text-sky-700 mt-0.5">${dadWeeks} tyg.</div>
                <div class="text-[10px] text-slate-500">w tym 9 tyg. nieprzenoszalnych</div>

            </div>

            <input type="range" min="14" max="${maxMomWeeks}" value="${appState.momWeeks}" oninput="appState.momWeeks=parseInt(this.value); renderScreen();" class="w-full">

            <div class="text-xs font-extrabold text-slate-900">Kreator wniosków (symulacja eZUS / gov.pl)</div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="openFormWizardModal('ZAM')" class="p-3 rounded-2xl bg-zus-light/60 hover:bg-zus-light text-left cursor-pointer transition">
                <div class="text-xs font-extrabold text-[#006B38]">📄 Wniosek ZAM</div>
                <div class="text-[10px] text-slate-600 mt-0.5">Zasiłek macierzyński i rodzicielski</div>
              </button>
              <button onclick="openFormWizardModal('USC')" class="p-3 rounded-2xl bg-slate-50 hover:bg-slate-100 text-left cursor-pointer transition">

            <div class="text-xs font-bold text-slate-500 px-1">Najważniejsze kroki</div>
            ${steps.map(st => {
              const done = appState.tasks[appState.phase][st.key];
              return `
                <div onclick="toggleStep('${appState.phase}', '${st.key}')" class="bg-white rounded-2xl p-3.5 border ${done ? 'border-[#007A3D]/40 bg-zus-light/30' : 'border-slate-200/80'} flex items-center gap-3 cursor-pointer transition">

    function applyTestCase(caseId) {
      const tc = testCases.find(c => c.id === caseId);
      if (!tc) return;
      appState.activeCaseId = caseId;
      appState.mObywatelLogged = true;
      appState.wizardStep = 3;
      Object.assign(appState, tc.data);
      updateMobywatelPill();
      closeModal();
      navigateTo('benefits');
      showToast('Załadowano: ' + tc.label);
    }

    function handlePdfUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      appState.mObywatelLogged = true;
      appState.wizardStep = 3;
      updateMobywatelPill();
      closeModal();
      navigateTo('benefits');
      showToast('Zweryfikowano PDF: ' + file.name);
    }

            • <a href="https://www.zus.pl" target="_blank" class="text-zus-primary underline font-bold">www.zus.pl</a> — wzory formularzy i poradnik 2026<br/>
            • <a href="https://www.gov.pl/web/rodzina/urlop-rodzicielski" target="_blank" class="text-zus-primary underline font-bold">gov.pl/rodzina</a> — uprawnienia rodzicielskie<br/>
            • <a href="https://www.pip.gov.pl" target="_blank" class="text-zus-primary underline font-bold">pip.gov.pl</a> — ochrona pracownicy w ciąży
          </div>
        </div>
      `);
    }

    // ==========================================
    // 10. CHAT, SHELL HELPERS & INITIALIZATION
    // ==========================================
    function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendQuickPrompt(text);
    }

    function sendQuickPrompt(text) {
      appState.chat.push({ sender: 'user', text });
      const q = text.toLowerCase();
      let reply = 'Możesz to obliczyć bezpośrednio w zakładce <strong>Świadczenia</strong> — kalkulator uwzględnia umowę o pracę, JDG, wcześniaki oraz podział tygodni między Mamę i Tatę.';
      if (q.includes('81,5') || q.includes('100')) {
        reply = 'Jeśli złożysz wniosek <strong>ZAM</strong> w ciągu 21 dni od porodu, otrzymasz stałe <strong>81,5%</strong> przez cały okres. Bez tego wniosku dostaniesz <strong>100%</strong> na urlopie macierzyńskim i <strong>70%</strong> na rodzicielskim.';
      } else if (q.includes('płatnik') || q.includes('pracodawca')) {
        reply = 'Zgodnie z art. 61 ustawy zasiłkowej, jeśli Twój pracodawca zgłasza powyżej <strong>20 ubezpieczonych</strong>, to on wypłaca zasiłek. Mniejsze firmy przekazują druk <strong>Z-3</strong> do ZUS.';
      } else if (q.includes('zam')) {
        reply = 'Od 24 października 2026 r. wniosek <strong>ZAM</strong> zastąpił dawne formularze ZUR i ZAO — jednym dokumentem wnioskujesz o zasiłek za urlop macierzyński, rodzicielski i ojcowski.';
      }
      appState.chat.push({ sender: 'bot', text: reply });
      renderScreen();
      setTimeout(() => {
        const box = document.getElementById('chat-messages');
        if (box) box.scrollTop = box.scrollHeight;
      }, 30);
    }

    function toggleParentRole() {
      appState.parentRole = appState.parentRole === 'mama' ? 'tata' : 'mama';
      document.getElementById('phone-role-pill').textContent = appState.parentRole === 'mama' ? '👩 Mama' : '👨 Tata';
      showToast(appState.parentRole === 'mama' ? 'Widok: Mama' : 'Widok: Tata');
    }

    function updateMobywatelPill() {
      const dot = document.getElementById('mobywatel-dot');
      const label = document.getElementById('mobywatel-label');
      if (dot && label) {
        dot.className = appState.mObywatelLogged ? 'w-2 h-2 rounded-full bg-zus-primary' : 'w-2 h-2 rounded-full bg-slate-300';
        label.textContent = appState.mObywatelLogged ? 'ZUS • OK' : 'mObywatel';
      }
    }

    function togglePowerLock() {
      appState.isLocked = !appState.isLocked;
      document.getElementById('ios-lock-screen').classList.toggle('hidden', !appState.isLocked);
    }

    function openModal(html) {
      document.getElementById('phone-modal-body').innerHTML = html;
      document.getElementById('phone-modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('phone-modal-backdrop').classList.add('hidden');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'phone-modal-backdrop') closeModal();
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('phone-toast');
      document.getElementById('phone-toast-text').textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function updateClock() {
      const now = new Date();
      const str = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      const c1 = document.getElementById('clock-time');
      const c2 = document.getElementById('lock-clock');
      if (c1) c1.textContent = str;
      if (c2) c2.textContent = str;
    }

    function renderScreen() {
      const container = document.getElementById('app-content');
      if (!container) return;
      if (appState.currentTab === 'start') container.innerHTML = renderStartScreen();
      else if (appState.currentTab === 'benefits') container.innerHTML = renderBenefitsScreen();
      else if (appState.currentTab === 'journey') container.innerHTML = renderJourneyScreen();
      else if (appState.currentTab === 'assistant') container.innerHTML = renderAssistantScreen();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const lockIcon = document.getElementById('lock-app-icon');
      if (lockIcon) {
        lockIcon.innerHTML = `
          <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="52" r="38" fill="#E6F4EC"/>
            <circle cx="48" cy="34" r="13" fill="#FFFFFF"/>
            <path d="M59 31L86 36L58 40Z" fill="#E8533F"/>
            <ellipse cx="48" cy="64" rx="17" ry="19" fill="#FFFFFF"/>
            <path d="M38 46C44 50 52 50 58 46L60 54C53 58 43 58 36 54Z" fill="#006B38"/>
          </svg>
        `;
      }
      updateClock();
      setInterval(updateClock, 30000);
      renderScreen();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/zusek/sw.js').catch(() => {});
      }
    });
  </script>
</body>
