<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#007A3D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZUSek" />
  <title>ZUSek — Przewodnik Przyszłej Mamy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            zus: {
              dark: '#006B38',
              primary: '#007A3D',
              hover: '#005C2E',
              light: '#E6F4EC',
              mint: '#D6EBE0',
              bg: '#E8F3EE',
              ivory: '#FAFAF7',
              coral: '#E8533F',
              coralLight: '#FDECE9'
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 15% 15%, #D7ECE2 0%, #EBF5F0 50%, #D0E5DB 100%);
      color: #1A2421;
    }
    /* Native PWA Standalone & Mobile Fullscreen Experience */
    @media (max-width: 640px), (display-mode: standalone) {
      body {
        padding: 0 !important;
        background: #FAFAF7 !important;
      }
      #wrapper-header, #wrapper-footer {
        display: none !important;
      }
      #phone-frame {
        max-width: 100% !important;
        width: 100vw !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      #phone-statusbar, #home-indicator-bar {
        display: none !important;
      }
    }
    /* Custom subtle scrollbar inside phone */
    .phone-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .phone-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .phone-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 122, 61, 0.2);
      border-radius: 9999px;
    }
    .phone-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 122, 61, 0.4);
    }
    /* Smooth screen transition */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .screen-enter {
      animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes floatStork {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .stork-float {
      animation: floatStork 3.4s ease-in-out infinite;
    }
    /* Range slider custom styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: #D6EBE0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #007A3D;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin-top: -7px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 overflow-x-hidden">

  <!-- Top Controls Bar (Desktop / Wrapper controls) -->

    <div class="flex items-center gap-3">
      <div class="bg-[#007A3D] text-white font-extrabold text-sm px-2.5 py-1 rounded-lg tracking-tight shadow-xs">
        ZUS
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-bold text-slate-800 leading-tight">ZUSek — Przewodnik Przyszłej Mamy</h1>
        <p class="text-[11px] text-slate-500">Kliknij element na ekranie telefonu lub pobierz plik na urządzenie</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <!-- Role switcher (Mama / Tata) -->
      <button onclick="toggleParentRole()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-zus-light transition flex items-center gap-1.5 cursor-pointer" title="Przełącz perspektywę Mama / Tata">
        <span id="role-badge-icon">👩</span>
        <span id="role-badge-label">Rola: Mama</span>
      </button>

      <!-- Quick stage switcher for testing -->
      <button onclick="quickSwitchStage()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-zus-light text-zus-dark hover:bg-zus-mint transition flex items-center gap-1.5 cursor-pointer" title="Przełącz szybko między ciążą a 12. miesiącem życia">
        <span id="quick-stage-dot" class="w-2 h-2 rounded-full bg-zus-primary"></span>
        <span id="quick-stage-label">Etap: 12. tydz. ciąży</span>
      </button>

      <!-- Download App File Button -->
      <button onclick="openDownloadAppModal()" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-[#007A3D] text-white hover:bg-[#005C2E] transition flex items-center gap-1.5 shadow-xs cursor-pointer" title="Pobierz aplikację na komputer lub telefon">
        <span>⬇</span>
        <span>Pobierz na telefon</span>
      </button>

      <!-- Fullscreen Toggle -->
      <button id="fullscreen-btn" onclick="toggleFullscreenMode()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-800 text-white hover:bg-slate-700 transition flex items-center gap-1.5 cursor-pointer">
        <svg id="fs-icon-expand" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
        <span id="fs-btn-text">Pełny ekran</span>
      </button>
    </div>
  </header>

    // ==========================================
    // 3. NAVIGATION & UI HELPERS
    // ==========================================
    function navigateTo(tabName) {
      appState.currentTab = tabName;
      closeModal();

      const topBar = document.getElementById('app-top-bar');
      if (tabName === 'start') {
        topBar.classList.add('hidden');
      } else {
        topBar.classList.remove('hidden');
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        const isTarget = btn.getAttribute('data-tab') === tabName;
        if (isTarget) {
          btn.classList.remove('text-slate-400', 'hover:text-slate-600');
          btn.classList.add('text-zus-primary');
        } else {
          btn.classList.add('text-slate-400', 'hover:text-slate-600');
          btn.classList.remove('text-zus-primary');
        }
      });

      renderCurrentScreen();
      document.getElementById('app-content').scrollTop = 0;
    }

    function openCareSection(subTab) {
      appState.careModule.subTab = subTab;
      navigateTo('care');
    }

    let toastTimeout = null;
    function showToast(message) {
      const toast = document.getElementById('phone-toast');
      const toastText = document.getElementById('phone-toast-text');
      toastText.textContent = message;
      toast.classList.remove('opacity-0', '-translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('phone-modal-backdrop');
      const body = document.getElementById('phone-modal-body');
      body.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      const backdrop = document.getElementById('phone-modal-backdrop');
      backdrop.classList.add('hidden');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'phone-modal-backdrop') {
        closeModal();
      }
    }

    function toggleFullscreenMode() {
      appState.isFullscreen = !appState.isFullscreen;
      const phone = document.getElementById('phone-frame');
      const header = document.getElementById('wrapper-header');
      const footer = document.getElementById('wrapper-footer');
      const btnText = document.getElementById('fs-btn-text');

      if (appState.isFullscreen) {
        phone.classList.remove('max-w-[405px]', 'h-[820px]', 'max-h-[85vh]', 'rounded-[46px]', 'shadow-[0_24px_60px_-12px_rgba(14,53,36,0.28),0_0_0_10px_#1E2623,0_0_0_12px_#3A4641]');
        phone.classList.add('max-w-full', 'w-screen', 'h-screen', 'max-h-screen', 'rounded-none');
        header.classList.add('hidden');
        footer.classList.add('hidden');
        document.body.classList.remove('p-2', 'sm:p-4');
        document.body.classList.add('p-0');
        addExitFullscreenPill();
      } else {
        phone.classList.add('max-w-[405px]', 'h-[820px]', 'max-h-[85vh]', 'rounded-[46px]', 'shadow-[0_24px_60px_-12px_rgba(14,53,36,0.28),0_0_0_10px_#1E2623,0_0_0_12px_#3A4641]');
        phone.classList.remove('max-w-full', 'w-screen', 'h-screen', 'max-h-screen', 'rounded-none');
        header.classList.remove('hidden');
        footer.classList.remove('hidden');
        document.body.classList.add('p-2', 'sm:p-4');
        document.body.classList.remove('p-0');
        btnText.textContent = 'Pełny ekran';
        const pill = document.getElementById('exit-fs-pill');
        if (pill) pill.remove();
      }
    }

    function addExitFullscreenPill() {
      if (document.getElementById('exit-fs-pill')) return;
      const pill = document.createElement('button');
      pill.id = 'exit-fs-pill';
      pill.onclick = toggleFullscreenMode;
      pill.className = 'fixed bottom-20 right-4 z-50 bg-slate-900/85 text-white text-xs font-semibold px-3 py-2 rounded-full shadow-lg backdrop-blur-xs cursor-pointer';
      pill.textContent = '↙ Widok ramki';
      document.body.appendChild(pill);
    }

    function toggleParentRole() {
      appState.parentRole = appState.parentRole === 'mama' ? 'tata' : 'mama';
      const isMama = appState.parentRole === 'mama';
      document.getElementById('role-badge-icon').textContent = isMama ? '👩' : '👨';
      document.getElementById('role-badge-label').textContent = isMama ? 'Rola: Mama' : 'Rola: Tata';
      const phonePill = document.getElementById('phone-role-pill');
      if (phonePill) phonePill.textContent = isMama ? '👩 Mama' : '👨 Tata';
      renderCurrentScreen();
      showToast(isMama ? 'Przełączono na perspektywę: Mama' : 'Przełączono na perspektywę: Tata (urlop ojcowski i 9 tyg.)');
    }

    function updateQuickStageIndicator() {
      const label = document.getElementById('quick-stage-label');
      if (appState.phase === 'pregnancy') {
        label.textContent = `Etap: ${appState.pregnancyWeek}. tydz. ciąży`;
      } else {
        label.textContent = `Etap: Dziecko ${appState.babyMonths} mies.`;
      }
    }

    function quickSwitchStage() {
      if (appState.phase === 'pregnancy') {
        appState.phase = 'postpartum';
        appState.babyMonths = 12;
        showToast('Tryb: Dziecko 12 mies. (Aktywny Rodzic)');
      } else {
        appState.phase = 'pregnancy';
        appState.pregnancyWeek = 12;
        showToast('Tryb: 12. tydzień ciąży');
      }
      updateQuickStageIndicator();
      renderCurrentScreen();
    }

    // ==========================================
    // 4. SCREEN RENDERERS
    // ==========================================
    function renderCurrentScreen() {
      const container = document.getElementById('app-content');
      switch (appState.currentTab) {
        case 'start':
          container.innerHTML = renderStartScreen();
          break;
        case 'journey':
          container.innerHTML = renderJourneyScreen();
          break;
        case 'benefits':
          container.innerHTML = renderBenefitsScreen();
          break;
        case 'care':
          container.innerHTML = renderCareScreen();
          break;
        case 'more':
          container.innerHTML = renderMoreScreen();
          break;
      }
    }

      const halfMinWage = Math.round(cm.minWage2026 / 2);
      const coveredBase = Math.min(cm.nannyGrossSalary, halfMinWage);
      const excessBase = Math.max(0, cm.nannyGrossSalary - halfMinWage);

      const stateZusPaid = Math.round(coveredBase * 0.315);

      return `
        <div class="space-y-3.5">
          <div class="p-3.5 rounded-2xl bg-zus-light/85 border border-zus-mint">
            <h3 class="text-xs font-extrabold text-zus-dark">👵 Umowa uaktywniająca z Nianią lub Babcią</h3>
            <p class="text-[11px] text-slate-700 mt-1 leading-snug">

            </p>
          </div>

            <div class="grid grid-cols-3 gap-1.5 text-center pt-1">
              <div class="p-2 rounded-xl bg-emerald-50 border border-emerald-100">
                <div class="text-[9.5px] font-bold text-slate-500">ZUS płaci za Was</div>
                <div class="text-xs font-extrabold text-zus-primary mt-0.5">+${stateZusPaid} zł</div>
              </div>
              <div class="p-2 rounded-xl bg-slate-50 border border-slate-200">
                <div class="text-[9.5px] font-bold text-slate-500">Dopłata ZUS rodzica</div>
                <div class="text-xs font-extrabold text-slate-800 mt-0.5">${parentExtraZus} zł</div>
              </div>
              <div class="p-2 rounded-xl bg-sky-50 border border-sky-100">
                <div class="text-[9.5px] font-bold text-slate-500">Niania „na rękę”</div>
                <div class="text-xs font-extrabold text-sky-900 mt-0.5">~${nannyNetPay} zł</div>
              </div>
            </div>

            <p class="text-[10.5px] text-slate-500 leading-snug">
              💡 <strong>Wskazówka:</strong> Babcia na emeryturze również może podpisać umowę uaktywniającą — odprowadzane składki podwyższą jej emeryturę, a Wy możecie równolegle pobierać 1500 zł z programu „Aktywni rodzice w pracy”!
            </p>
          </div>

          <div class="p-4 rounded-2xl bg-white border border-slate-200/90 shadow-2xs space-y-2.5">

    function handleAiChatSubmit(e) {

    function sendAiQuestion(questionText) {
      appState.chatMessages.push({ sender: 'user', text: escapeHTML(questionText) });
      const answer = generateZusekAiReply(questionText);
      appState.chatMessages.push({ sender: 'bot', text: answer });
      openAiChatModal();
    }

    function generateZusekAiReply(q) {
      const lower = q.toLowerCase();
      if (lower.includes('babci') || lower.includes('emerytur') || lower.includes('niani')) {
        return '<strong>Tak!</strong> Babcia lub dziadek (także na emeryturze) może być nianią na podstawie <strong>umowy uaktywniającej</strong> dla dziecka powyżej 20. tygodnia życia. ZUS opłaca wtedy składki od podstawy do 50% płacy minimalnej (co dolicza się do emerytury babci!), a rodzice mogą dodatkowo pobierać <strong>1500 zł/mies.</strong> z programu „Aktywni rodzice w pracy” od 12. miesiąca życia dziecka.';
      }
      if (lower.includes('tat') || lower.includes('ojc') || lower.includes('rodzicielsk')) {
        return 'Tata ma prawo do <strong>2 tygodni urlopu ojcowskiego</strong> (100% płatnego, do 12. mies. życia dziecka) oraz <strong>9 tygodni nieprzenoszalnego urlopu rodzicielskiego</strong> (70%). Uwaga: podczas pobierania zasiłku macierzyńskiego/rodzicielskiego rodzic jest traktowany w programie <strong>Aktywny Rodzic</strong> jako aktywny zawodowo, więc po ukończeniu przez malucha 12. miesiąca możecie korzystać ze wsparcia!';
      }
      if (lower.includes('800') || lower.includes('drugi')) {
        return 'Na nowo narodzone dziecko składasz osobny wniosek o <strong>800+</strong> (przez eZUS/PUE, bank lub Emp@tię). Masz na to <strong>3 miesiące od dnia urodzenia</strong> — wtedy ZUS wypłaci świadczenie z wyrównaniem od miesiąca porodu. Okres świadczeniowy na starsze dziecko biegnie swoim trybem (wnioski od 1 lutego na nowy okres).';
      }
      if (lower.includes('usc') || lower.includes('termin') || lower.includes('dni') || lower.includes('zcna')) {
        return 'Najważniejsze terminy po porodzie:<br/>1. <strong>21 dni</strong> — zgłoszenie urodzenia dziecka w USC (online przez gov.pl — automatycznie nadawany jest PESEL).<br/>2. <strong>7 dni</strong> — zgłoszenie dziecka do ubezpieczenia zdrowotnego NFZ (druk <strong>ZUS ZCNA</strong> u pracodawcy lub w ZUS).<br/>3. <strong>21 dni</strong> — wniosek o zasiłek macierzyński/rodzicielski.<br/>4. <strong>3 miesiące</strong> — wniosek o 800+ z wyrównaniem.';
      }
      if (lower.includes('żłob') || lower.includes('zlob') || lower.includes('aktywny')) {
        return 'Program <strong>Aktywny Rodzic</strong> (12–35 mies. życia) ma 3 warianty:<br/>• <strong>Aktywni rodzice w pracy:</strong> 1500 zł/mies. (1900 zł z orzeczeniem) dla pracujących rodziców.<br/>• <strong>Aktywnie w żłobku:</strong> dopłata do 1500 zł/mies. do czesnego w żłobku, klubie dziecięcym lub u dziennego opiekuna.<br/>• <strong>Aktywnie w domu:</strong> 500 zł/mies., gdy rodzic zostaje z dzieckiem w domu.';
      }
      return 'Świetne pytanie! W aplikacji ZUSek możesz sprawdzić ten temat w zakładce <strong>Świadczenia</strong> lub <strong>Opieka & Żłobki</strong>. Pamiętaj, że po narodzinach dziecka masz 21 dni na USC i 3 miesiące na wniosek 800+ z wyrównaniem. Chcesz, żebym przeliczył Twój zasiłek macierzyński albo dopłatę do żłobka?';
    }

    function downloadIndexHtml() {
      const fullDoc = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([fullDoc], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Pobrano gotowy plik index.html!');
    }

    function copyFullHtmlToClipboard() {
      const fullDoc = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const textarea = document.createElement('textarea');
      textarea.value = fullDoc;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Skopiowano cały kod HTML do schowka!');
      } catch (err) {
        showToast('Użyj przycisku Pobierz index.html');
      }
      document.body.removeChild(textarea);
    }

    // Utility: Escape HTML
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
